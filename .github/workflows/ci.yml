name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  TERMUX_VERSION: latest

jobs:
  build:
    name: Build (ARM64)
    runs-on: ubuntu-latest
    container:
      image: termux/termux:latest
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            clang make git python3 \
            libc6-dev libstdc++6

      - name: Build Release
        run: |
          make clean
          make

      - name: Build Debug
        run: |
          make clean
          make DEBUG=1

      - name: Verify Binary
        run: |
          file cmd.exe
          ./cmd.exe /c "ver && echo Build OK"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmd-arm64-${{ github.sha }}
          path: cmd.exe
          retention-days: 30

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    container:
      image: termux/termux:latest
      options: --privileged
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            clang make git python3 strace

      - name: Download Binary
        uses: actions/download-artifact@v4
        with:
          name: cmd-arm64-${{ needs.build.outputs.sha }}
          path: .

      - name: Make Executable
        run: chmod +x cmd.exe

      - name: Run Test Suite
        run: |
          ./scripts/run_tests.sh

      - name: Test Core Builtins
        run: |
          ./cmd.exe /c "ver"
          ./cmd.exe /c "dir"
          ./cmd.exe /c "cd .. && pwd"
          ./cmd.exe /c "echo test"
          ./cmd.exe /c "copy cmd.exe cmd_copy.exe && type cmd_copy.exe >/dev/null && del cmd_copy.exe"
          ./cmd.exe /c "md testdir && rd testdir"

      - name: Test Path Translation
        run: |
          ./cmd.exe /c "cd / && pwd"
          ./cmd.exe /c "cd /data && pwd"
          ./cmd.exe /c "copy cmd.exe /data/test_copy.exe && del /data/test_copy.exe"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Binary
        uses: actions/download-artifact@v4
        with:
          name: cmd-arm64-${{ needs.build.outputs.sha }}
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: cmd.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Publish to Termux package repo
  # package:
  #   name: Build Termux Package
  #   runs-on: ubuntu-latest
  #   needs: release
  #   steps:
  #     - uses: termux/termux-packages-action@v1
  #       with:
  #         package: termux-cmd